name: Fix Case 2 frontend data
on:
  push:
    paths:
      - '.github/workflows/fix-cases-js.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair cases.js
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('cases.js')
          s = p.read_text()

          case2 = {
            "caseId": "CASE-02",
            "caseNumber": 2,
            "title": "Opportunity Cost & TCO (British Airways IT Outsourcing)",
            "authoritativeCaseContent": "Case 2: Opportunity Cost and TCO — British Airways IT Outsourcing\n\nOpportunity cost is the value of the best alternative forgone when one option is selected over another. A sourcing decision should therefore consider not only the direct cost of each option but also the economic value sacrificed by choosing it.\n\nIn 2016, British Airways outsourced more than 700 UK-based IT roles. For this exercise, assume that BA had compared two alternatives over five years:\n\n- Retain the IT activities in-house at a five-year TCO of £720 million.\n- Outsource the IT activities at a five-year TCO of £540 million.\n\nThe outsourcing option appeared to offer £180 million in direct savings.\n\nHowever, assume that each of the 700 internal IT employees supported £350,000 of company revenue annually and that BA operated at a 5% profit margin. For this exercise, treat the corresponding five-year profit contribution as an opportunity cost of losing the internal capability. Revenue must first be converted into profit contribution using the stated margin.\n\nIn 2017, BA experienced a major IT disruption affecting approximately 75,000 passengers, with reported losses of nearly £150 million. Also assume that retaining stronger internal IT capability would have prevented this loss.",
            "studentQuestions": [
              "After considering direct TCO, the opportunity cost of losing internal capability and the assumed disruption loss, what is the five-year economic difference between the two options?",
              "Which option appears economically preferable, and why?",
              "What assumptions or risks could change that conclusion?"
            ],
            "relatedTopics": [
              "TCO of a Technology Service",
              "Opportunity Cost",
              "Types of IT Outsourcing Services",
              "IT Service Sourcing Strategy"
            ]
          }

          start = s.index('  {\n    "caseId": "CASE-02"')
          end = s.index('  {\n    "caseId": "CASE-03"', start)
          replacement = '  ' + json.dumps(case2, ensure_ascii=False, indent=2).replace('\n', '\n  ') + ',\n'
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Validate cases.js
        run: node --check cases.js
      - name: Commit repaired frontend data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases.js
          git commit -m "Fix Case 2 frontend data syntax"
          git push
