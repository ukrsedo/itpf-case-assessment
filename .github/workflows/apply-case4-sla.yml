name: Apply Case 4 SLA update
on:
  push:
    paths:
      - 'tools/update_case4_sla.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/update_case4_sla.py
      - run: node --check cases.js && node --check worker.js && python -m json.tool assessment-rules.json >/dev/null
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cases.js worker.js assessment-rules.json
          git commit -m 'Restore Case 4 SLA and Tier 4 facts'
          git push
