name: Update Case 2 economics
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-case2-economics.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Case 2
        shell: python
        run: |
          import json, re
          from pathlib import Path

          briefing = """Opportunity cost is the value of the best alternative forgone when a decision is made. In sourcing, this means considering not only the direct cost of each option, but also the economic benefits that may be lost by choosing one alternative instead of another.

In 2016, British Airways outsourced more than 700 UK-based IT roles.

For this exercise, assume BA was comparing two sourcing alternatives over a five-year period:
- Keep the IT activities in-house: £720 million five-year TCO.
- Outsource the IT activities: £540 million five-year TCO.

In 2017, BA experienced a major IT disruption affecting approximately 75,000 passengers, with reported losses of nearly £150 million. For this exercise, assume that retaining stronger internal IT capability would have prevented this loss.

Also assume that each of the 700 internal IT employees supports £350,000 of company revenue per year and that BA operates at a 5% profit margin. Revenue itself should not be compared directly with sourcing savings, so any economic comparison should use the profit contribution associated with that revenue.

Your task is to compare the sourcing alternatives using TCO, opportunity cost, retained capability and business continuity rather than supplier cost alone."""
          questions = [
            "Compare the economic opportunity costs of the two sourcing options using the information provided. Show your calculations.",
            "Which sourcing option appears economically preferable over five years, and why?",
            "What assumptions or risks could change that conclusion?"
          ]

          # cases.js
          p = Path('cases.js')
          s = p.read_text()
          start = s.index('    "caseId": "CASE-02"')
          end = s.index('    "caseId": "CASE-03"')
          block = s[start:end]
          block = re.sub(r'    "authoritativeCaseContent": ".*?",\n    "studentQuestions": \[.*?\n    \],',
                         '    "authoritativeCaseContent": ' + json.dumps(briefing, ensure_ascii=False) + ',\n    "studentQuestions": ' + json.dumps(questions, ensure_ascii=False, indent=6).replace('\n', '\n    ')+',',
                         block, flags=re.S)
          s = s[:start] + block + s[end:]
          p.write_text(s)

          # assessment-rules.json
          p = Path('assessment-rules.json')
          data = json.loads(p.read_text())
          data['caseSpecificRules']['CASE-02'] = [
            "Question 1 requires a numerical comparison of the economic opportunity costs using only the case assumptions.",
            "For choosing in-house, recognize the £180 million five-year TCO advantage forgone versus outsourcing (£720m - £540m).",
            "For choosing outsourcing, recognize the assumed value forgone from retained internal capability: £61.25 million five-year profit contribution (700 x £350,000 x 5% x 5 years) plus the assumed £150 million disruption loss prevented by stronger internal capability, giving £211.25 million under the exercise assumptions.",
            "Do not compare £350,000 revenue per FTE directly with sourcing savings; apply the stated 5% profit margin first.",
            "Under the stated assumptions, insourcing has a £31.25 million economic advantage over outsourcing (£211.25m - £180m).",
            "Question 3 should test the assumptions: especially whether insourcing really would have prevented the full £150m loss, whether revenue supported per FTE is a valid proxy for economic value, and whether all relevant transition, governance, resilience and supplier-performance risks are captured.",
            "A different recommendation may receive full credit only if the student explicitly challenges one or more case assumptions and explains how that changes the economics."
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # worker.js: replace CASE-02 embedded guidance and stale special rule
          p = Path('worker.js')
          s = p.read_text()
          guidance = """Opportunity cost is the value of the best alternative forgone when a decision is made.

For this exercise, compare two five-year sourcing alternatives:
- In-house TCO: £720 million.
- Outsourced TCO: £540 million.

The opportunity cost of choosing in-house is the £180 million five-year TCO advantage forgone by not outsourcing.

For the outsourcing alternative, use the student-facing assumptions to value benefits forgone by not retaining internal capability:
- 700 FTE x £350,000 revenue supported per year x 5% profit margin x 5 years = £61.25 million five-year profit contribution.
- The case instructs students to assume that retaining stronger internal IT capability would have prevented the £150 million disruption loss.
- Under those explicit exercise assumptions, the quantified benefits forgone by outsourcing total £211.25 million.

Do not compare revenue directly with savings; apply the 5% profit margin first.

Under the stated assumptions, the economic comparison is £180 million versus £211.25 million, a £31.25 million advantage for insourcing. However, the third question should test the assumptions, especially the causal assumption that insourcing would have prevented the full disruption loss and the use of revenue-supported-per-FTE as a proxy for economic value.

Score the student's reasoning against the three student questions. A different sourcing recommendation can still be strong if the student explicitly challenges an assumption and recalculates or explains the economic consequence."""
          # Replace embeddedCourseGuidance within CASE-02 object only
          cstart = s.index('"CASE-02"')
          cend = s.index('"CASE-03"', cstart)
          cblock = s[cstart:cend]
          cblock2, n = re.subn(r'embeddedCourseGuidance\s*:\s*`.*?`', 'embeddedCourseGuidance:`' + guidance.replace('`','\\`') + '`', cblock, count=1, flags=re.S)
          if n == 0:
            cblock2, n = re.subn(r'"embeddedCourseGuidance"\s*:\s*".*?"', '"embeddedCourseGuidance":' + json.dumps(guidance, ensure_ascii=False), cblock, count=1, flags=re.S)
          if n == 0:
            raise RuntimeError('CASE-02 embeddedCourseGuidance not found')
          s = s[:cstart] + cblock2 + s[cend:]

          old_rule = "CASE-02 SPECIAL RULE: Never require, infer, or score against the £62.5 million opportunity-cost calculation. It is not a required student calculation. Assess the opportunity-cost question conceptually using the case information available to the student. A student can receive 5/5 without providing a numerical opportunity-cost figure."
          new_rule = "CASE-02 SPECIAL RULE: Use only the current student-facing Case 2 assumptions and questions. Require the numerical opportunity-cost comparison requested in Question 1. Do not use or mention the obsolete £62.5 million tutor calculation. Apply the stated 5% profit margin before converting revenue-supported-per-FTE into economic value."
          if old_rule in s:
            s = s.replace(old_rule, new_rule)
          else:
            s = re.sub(r'CASE-02 SPECIAL RULE:.*?(?=(?:\\n|\n)[A-Z][A-Z -]{4,}:|(?:\\n|\n){2})', new_rule, s, count=1, flags=re.S)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cases.js assessment-rules.json worker.js
          git commit -m "Rewrite Case 2 with consistent opportunity cost economics" || exit 0
          git push